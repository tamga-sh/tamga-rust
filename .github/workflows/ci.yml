name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
      # --all-targets so test-only lints aren't missed; a plain `cargo clippy`
      # skips test and example targets.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
      - uses: taiki-e/install-action@v2
        timeout-minutes: 10
        with:
          tool: cargo-deny
      - run: cargo deny check

  test-and-coverage:
    name: test-and-coverage
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
      - uses: taiki-e/install-action@v2
        timeout-minutes: 10
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov nextest --lcov --output-path lcov.info --fail-under-lines 80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        timeout-minutes: 10
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
      # Pinned to the exact MSRV (1.75.0), separate from the floating
      # `stable` toolchain used by the other jobs — catches accidental use
      # of a newer-than-MSRV language feature or API that `stable` wouldn't.
      - uses: dtolnay/rust-toolchain@1.75.0
        timeout-minutes: 10
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
      - run: cargo check --all-features
